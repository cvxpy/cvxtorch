[tool.ruff]
select = [
    "E",
    "F",
    "I",
    "NPY201",
    "W605",  # Check for invalid escape sequences in docstrings (errors in py >= 3.11)
]
line-length = 100
exclude = [
    "examples",
    "doc",
    "*__init__.py"
]
# The minimum Python version that should be supported
target-version = "py39"


[tool.pytest.ini_options]
testpaths = [
    "/tests/"
]
filterwarnings = [
    "ignore::RuntimeWarning:cvxpy.*",
    "ignore::FutureWarning:cvxpy.*"
]


[project]
name = "cvxtorch"
description = "A CVXPY to Pytorch Expression converter."
dependencies = [
    "cvxpy",
    "numpy",
    "scipy >= 1.1.0",
    "torch",
]
requires-python = ">=3.9"
dynamic = ["version"]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.optional-dependencies]
dev = [
    "pytest",
    "pre-commit",
    "ruff",
    "ruff-lsp",
    "ipython",
    "matplotlib",
    "jupyterlab",
    "ipdb",
    "marimo",
    "pyscipopt",
]
